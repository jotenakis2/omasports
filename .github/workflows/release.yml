name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Un miroir lent ne doit pas bloquer le job : bornes de temps et reprises.
          # -o Acquire::ForceIPv4 : les runners bloquent parfois sur IPv6,
          # ce qui fait pendre apt-get update jusqu'au timeout.
          timeout 420 sudo -E apt-get update -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 600 sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            shellcheck \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-wayland \
            qt6-wayland-dev \
            qt6-tools-dev \
            qml6-module-qttest \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            libqt6quicktest6

      - name: Build and test
        run: ./check.sh

      - name: Package
        run: |
          set -eu
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          name="omasports-${short_sha}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          install -m755 build/omasports "dist/${name}/omasports"
          install -m644 LICENSE README.md README.fr.md CHANGELOG.md "dist/${name}/"
          install -m644 pkgbuild/omasports.desktop pkgbuild/omasports.svg "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "${TAG}" --title "${TAG}" --generate-notes >/dev/null 2>&1 || true
          gh release upload "${TAG}" omasports-*-linux-${{ matrix.arch }}.tar.gz \
            omasports-*-linux-${{ matrix.arch }}.tar.gz.sha256 --clobber
