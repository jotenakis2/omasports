name: Linux builds

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # qmake6, make et g++ sont requis par bin/build
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            shellcheck \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-wayland \
            qt6-wayland-dev \
            qt6-tools-dev \
            qml6-module-qttest \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml \
            qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            libqt6quicktest6

      - name: QML diagnostic
        run: |
          QML_DIR="$(qtpaths6 --query QT_INSTALL_QML)"
          echo "QT_INSTALL_QML=${QML_DIR}"
          ls "${QML_DIR}"
          echo "--- QtQuick ---"
          ls "${QML_DIR}/QtQuick" || true
          echo "--- QtTest ---"
          ls "${QML_DIR}/QtTest" || true

      - name: Build and test
        run: ./check.sh

      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          name="omasports-${short_sha}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          install -m755 build/omasports "dist/${name}/omasports"
          install -m644 LICENSE README.md "dist/${name}/"
          install -m644 pkgbuild/omasports.desktop pkgbuild/omasports.svg "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omasports-${{ github.sha }}-linux-${{ matrix.arch }}
          path: |
            omasports-*-linux-${{ matrix.arch }}.tar.gz
            omasports-*-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
